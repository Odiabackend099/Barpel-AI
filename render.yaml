services:
  # Backend API (frontend deploys to Vercel separately)
  - type: web
    name: barpel-backend
    env: node
    plan: standard
    region: oregon
    buildCommand: cd backend && npm install --omit=dev
    startCommand: cd backend && npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # PORT intentionally omitted — Render injects its own PORT env var
      # The server already uses process.env.PORT || 6001
      - key: BACKEND_URL
        value: https://api.barpel.ai
      - key: FRONTEND_URL
        value: https://app.barpel.ai
      - key: CORS_ORIGIN
        value: https://app.barpel.ai,https://barpel.ai
      - key: GOOGLE_REDIRECT_URI
        value: https://api.barpel.ai/api/google-oauth/callback
      # ── Secrets: set manually in Render dashboard ──────────────────────────
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: VAPI_PRIVATE_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_ENCRYPTION_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
    routes:
      - path: /
        matchType: prefix
# Note: No `databases:` section — project uses external Supabase (not Render-managed DB)
